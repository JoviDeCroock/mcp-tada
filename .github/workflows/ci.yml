name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.sdk }} SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [current, minimum]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install minimum supported SDKs
        if: matrix.sdk == 'minimum'
        run: pnpm -r update @modelcontextprotocol/client@2.0.0 @modelcontextprotocol/server@2.0.0 @modelcontextprotocol/sdk@1.20.0

      - name: Verify
        run: pnpm run verify --check
